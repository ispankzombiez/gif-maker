name: Deploy to GitHub Pages

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        if: github.ref_name == 'main'
        run: npm run build
        env:
          VITE_BASE_PATH: /gif-maker/

      - name: Build (staging)
        if: github.ref_name == 'test'
        run: npm run build
        env:
          VITE_BASE_PATH: /gif-maker/test/

      - name: Deploy production to gh-pages root
        if: github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: test/

      - name: Deploy staging to gh-pages/test
        if: github.ref_name == 'test'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: test
          clean: false
